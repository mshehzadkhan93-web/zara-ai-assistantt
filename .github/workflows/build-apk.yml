name: Build and Release Zara Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Android APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Zara-AI-Assistant.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zara-AI-Assistant-APK
          path: app/build/outputs/apk/debug/Zara-AI-Assistant.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Zara AI Assistant v1.0.0 (APK)"
          body: "Direct downloadable APK for your Android mobile phone!"
          files: app/build/outputs/apk/debug/Zara-AI-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
